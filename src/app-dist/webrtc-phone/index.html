  <head>

      name="description"
      content="Browser based WebRTC SIP phone for VitelGlobal calls."

      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    >

    <meta name="format-detection" content="telephone=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f6">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#292929">

    <meta http-equiv="Expires" content="0">

    <link rel="manifest" type="application/manifest+json" href="https://webrtc.officemeetings.net/webrtc/manifest.json">
    <link rel="stylesheet" type="text/css" href="https://dtd6jl0d42sve.cloudfront.net/lib/Normalize/normalize-v8.0.1.css">
    <link rel="stylesheet preload prefetch" type="text/css" as="style" href="https://dtd6jl0d42sve.cloudfront.net/lib/fonts/font_roboto/roboto.css">
    <link rel="stylesheet preload prefetch" type="text/css" as="style" href="https://dtd6jl0d42sve.cloudfront.net/lib/fonts/font_awesome/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="https://dtd6jl0d42sve.cloudfront.net/lib/jquery/jquery-ui-1.13.2.min.css">
    <link rel="stylesheet" type="text/css" href="https://dtd6jl0d42sve.cloudfront.net/lib/Croppie/Croppie-2.6.4/croppie.css">
    <link rel="stylesheet" type="text/css" href="https://webrtc.officemeetings.net/webrtc/phone.css">
    <link rel="stylesheet" type="text/css" href="https://webrtc.officemeetings.net/webrtc/phone.ui.css">
    <script type="text/javascript">
      var VITEL_AUTO_DIAL_STORAGE_KEY = "vitelglobal.webrtc.autoDial";
      var VITEL_AUTO_DIAL_TTL_MS = 5 * 60 * 1000;
      var VITEL_AUTO_DIAL_RETRY_MS = 900;
      var VITEL_AUTO_DIAL_MAX_ATTEMPTS = 45;
      var vitelAutoDialRetryTimer = null;

      function vitelStoreAutoDialTarget() {
        try {
          var params = new URLSearchParams(window.location.search);
          var dialNumber = params.get("DialNumber") || params.get("TargetExtension") || params.get("target") || "";
          var shouldAutoDial = params.get("AutoCall") === "true" || params.get("AutoDial") === "true";

          if (!shouldAutoDial || !dialNumber) {
            return;
          }

          window.localStorage.setItem(
            VITEL_AUTO_DIAL_STORAGE_KEY,
            JSON.stringify({
              number: dialNumber,
              mode: params.get("CallMode") === "video" ? "video" : "audio",
              name: params.get("TargetName") || dialNumber,
              createdAt: Date.now()
            })
          );
        } catch (error) {
          console.warn("Unable to store WebRTC auto dial target", error);
        }
      }

      function vitelReadAutoDialTarget() {
        try {
          var rawTarget = window.localStorage.getItem(VITEL_AUTO_DIAL_STORAGE_KEY);
          var target = rawTarget ? JSON.parse(rawTarget) : null;

          if (!target || !target.number || Date.now() - Number(target.createdAt || 0) > VITEL_AUTO_DIAL_TTL_MS) {
            window.localStorage.removeItem(VITEL_AUTO_DIAL_STORAGE_KEY);
            return null;
          }

          return target;
        } catch (error) {
          window.localStorage.removeItem(VITEL_AUTO_DIAL_STORAGE_KEY);
          return null;
        }
      }

      function vitelIsPhoneRegistered() {
        var registerStatus = (document.getElementById("regStatus")?.textContent || "").trim().toLowerCase();
        var unregisterLink = document.getElementById("dereglink");
        var unregisterStyle = unregisterLink ? window.getComputedStyle(unregisterLink) : null;
        var isUnregisterVisible = Boolean(
          unregisterStyle &&
            unregisterStyle.display !== "none" &&
            unregisterStyle.visibility !== "hidden" &&
            Number(unregisterStyle.opacity || 1) !== 0
        );

        return (
          (registerStatus.includes("registered") &&
            !registerStatus.includes("unregistered") &&
            !registerStatus.includes("failed")) ||
          isUnregisterVisible
        );
      }

      function vitelTryAutoDialTarget() {
        var target = vitelReadAutoDialTarget();
        if (!target || typeof window.DialByLine !== "function") {
          return false;
        }

        if (!vitelIsPhoneRegistered()) {
          return false;
        }

        var dialNumber = String(target.number).replace(/[^\d*#+]/g, "");
        if (!dialNumber) {
          window.localStorage.removeItem(VITEL_AUTO_DIAL_STORAGE_KEY);
          return false;
        }

        var dialInput = document.getElementById("dialText");
        if (dialInput) {
          dialInput.value = dialNumber;
          dialInput.dispatchEvent(new Event("input", { bubbles: true }));
          dialInput.dispatchEvent(new Event("change", { bubbles: true }));
        }

        window.DialByLine(target.mode === "video" ? "video" : "audio", null, dialNumber, target.name || dialNumber);
        window.localStorage.removeItem(VITEL_AUTO_DIAL_STORAGE_KEY);
        return true;
      }

      function vitelStartAutoDialRetry() {
        if (vitelAutoDialRetryTimer) {
          return;
        }

        var attempts = 0;
        vitelAutoDialRetryTimer = window.setInterval(function() {
          attempts += 1;
          if (vitelTryAutoDialTarget() || attempts >= VITEL_AUTO_DIAL_MAX_ATTEMPTS) {
            window.clearInterval(vitelAutoDialRetryTimer);
            vitelAutoDialRetryTimer = null;
          }
        }, VITEL_AUTO_DIAL_RETRY_MS);
      }

      vitelStoreAutoDialTarget();

      try {
        window.localStorage.removeItem("HostingPrefix");
        window.localStorage.setItem("loadAlternateLang", "0");
      } catch (error) {
        console.warn("Unable to prepare WebRTC phone settings", error);
      }

      var phoneOptions = {
        loadAlternateLang: false
      };

      var web_hook_on_language_pack_loaded = function(){};
      var web_hook_on_before_init = function(){};
      var web_hook_on_init = function(){
        window.setTimeout(vitelStartAutoDialRetry, 1200);
      };
      var web_hook_on_userAgent_created = function(){};
      var web_hook_on_transportError = function(){};
      var web_hook_on_register = function(){
        window.setTimeout(vitelTryAutoDialTarget, 250);
      };
      var web_hook_on_registrationFailed = function(){};
      var web_hook_on_unregistered = function(){};
      var web_hook_on_invite = function(){};
      var web_hook_on_message = function(){};
      var web_hook_on_modify = function(){};
      var web_hook_on_dtmf = function(){};
      var web_hook_on_terminate = function(){};
      var web_hook_on_notify = function(){};
      var web_hook_on_self_notify = function(){};
      var web_hook_dial_out = function(){};
      var web_hook_on_add_buddy = function(){};
      var web_hook_on_edit_buddy = function(){};
      var web_hook_on_config_menu = function(){};
      var web_hook_on_messages_waiting = function(){};
      var web_hook_on_missed_notify = function(){};
      var web_hook_on_expand_video_area = function(){};
      var web_hook_on_restore_video_area = function(){};
      var web_hook_on_message_action = function(){};
      var web_hook_disable_dnd = function(){};
      var web_hook_enable_dnd = function(){};
      var web_hook_on_edit_media = function(){};
      var web_hook_sort_and_filter = function(){};
    </script>

  <body>
    <div class="loading">
      <span class="fa fa-circle-o-notch fa-spin"></span>
    </div>
    <div id="Phone"></div>
  </body>
