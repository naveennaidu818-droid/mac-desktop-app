name: Build macOS test installers

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish DMG installers directly to GitHub Releases"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  package:
    name: Build universal and dedicated macOS test installers
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate build configuration
        run: |
          npm run lint
          npm run test:notifications

      - name: Build macOS installers
        run: npm run dist:mac:test

      - name: Upload Universal macOS DMG installer (Works on ALL Macs)
        uses: actions/upload-artifact@v4
        with:
          name: vitelglobal-desktop-macos-universal-dmg
          if-no-files-found: error
          path: dist/macos-test/*universal*.dmg

      - name: Upload Apple Silicon macOS DMG installer (~110MB)
        uses: actions/upload-artifact@v4
        with:
          name: vitelglobal-desktop-macos-arm64-dmg
          if-no-files-found: error
          path: dist/macos-test/*arm64*.dmg

      - name: Upload Intel macOS DMG installer (~110MB)
        uses: actions/upload-artifact@v4
        with:
          name: vitelglobal-desktop-macos-x64-dmg
          if-no-files-found: error
          path: dist/macos-test/*x64*.dmg

      - name: Publish DMG Installers to GitHub Release
        if: github.event.inputs.publish_release == 'true' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/macos-test/*.dmg
          generate_release_notes: true
          draft: false
          prerelease: false