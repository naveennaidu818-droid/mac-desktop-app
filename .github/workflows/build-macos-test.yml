name: Build macOS test installers

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build unsigned universal macOS test installers
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate build configuration
        run: |
          npm run lint
          npm run test:notifications

      - name: Build macOS installers
        run: npm run dist:mac:test

      - name: Upload Apple Silicon macOS DMG installer (~110MB)
        uses: actions/upload-artifact@v4
        with:
          name: vitelglobal-desktop-macos-arm64-dmg
          if-no-files-found: error
          path: dist/macos-test/*arm64*.dmg

      - name: Upload Intel macOS DMG installer (~110MB)
        uses: actions/upload-artifact@v4
        with:
          name: vitelglobal-desktop-macos-x64-dmg
          if-no-files-found: error
          path: dist/macos-test/*x64*.dmg