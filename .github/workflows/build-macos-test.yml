name: Build macOS test installers

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish DMG installers directly to GitHub Releases"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  package:
    name: Build universal and dedicated macOS installers
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up macOS signing keychain
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$MACOS_CERTIFICATE_P12_BASE64" ]; then
            cert_path="$RUNNER_TEMP/certificate.p12"
            printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert_path"

            KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
            KEYCHAIN_PASSWORD="build_keychain_password_$(date +%s)"

            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            security import "$cert_path" \
              -k "$KEYCHAIN_PATH" \
              -P "$MACOS_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign \
              -T /usr/bin/pkgbuild \
              -T /usr/bin/productbuild

            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            # Set user keychain search list to include the newly created keychain
            EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')
            security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
            security default-keychain -s "$KEYCHAIN_PATH"

            echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
            echo "Installed and unlocked certificate into build keychain. Code signing identities:"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "No signing certificate secret found; building unsigned test DMG."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate build configuration
        run: |
          npm run lint
          npm run test:notifications

      - name: Build macOS installers
        run: npm run dist:mac:test

      - name: Upload Universal macOS DMG installer (Works on ALL Macs)
        uses: actions/upload-artifact@v4
        with:
          name: vitelglobal-desktop-macos-universal-dmg
          if-no-files-found: error
          path: dist/macos-test/*universal*.dmg

      - name: Upload Apple Silicon macOS DMG installer (~110MB)
        uses: actions/upload-artifact@v4
        with:
          name: vitelglobal-desktop-macos-arm64-dmg
          if-no-files-found: error
          path: dist/macos-test/*arm64*.dmg

      - name: Upload Intel macOS DMG installer (~110MB)
        uses: actions/upload-artifact@v4
        with:
          name: vitelglobal-desktop-macos-x64-dmg
          if-no-files-found: error
          path: dist/macos-test/*x64*.dmg

      - name: Publish DMG Installers to GitHub Release
        if: github.event.inputs.publish_release == 'true' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/macos-test/*.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
