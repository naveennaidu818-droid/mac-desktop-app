name: Build macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Sign, notarize, and verify universal macOS release
    runs-on: macos-14
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore signing certificate
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/vitelglobal-codesign.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          test -s "$certificate_path"
          chmod 600 "$certificate_path"
          if ! openssl pkcs12 -in "$certificate_path" -passin "pass:$CSC_KEY_PASSWORD" -info -noout >/dev/null 2>&1; then
            echo "The MACOS_CERTIFICATE_P12_BASE64 secret is not a valid PKCS#12 file, or MACOS_CERTIFICATE_PASSWORD is incorrect." >&2
            exit 1
          fi
          echo "CSC_LINK=$certificate_path" >> "$GITHUB_ENV"

      - name: Restore notarization API key
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Validate build configuration
        run: |
          npm run lint
          npm run test:notifications
          bash -n scripts/verify-macos-installed.sh

      - name: Build, sign, notarize, and verify
        run: npm run dist:mac:release

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vitelglobal-desktop-macos-universal
          if-no-files-found: error
          path: |
            dist/macos/*.dmg
            dist/macos/*.pkg
            dist/macos/*.zip
            dist/macos/latest-mac.yml
            dist/macos/*.blockmap
