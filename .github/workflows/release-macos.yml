name: Build macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Sign, notarize, and verify universal macOS release
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up macOS signing keychain
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$MACOS_CERTIFICATE_P12_BASE64" ]; then
            cert_path="$RUNNER_TEMP/certificate.p12"
            printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert_path"

            KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
            KEYCHAIN_PASSWORD="build_keychain_password_$(date +%s)"

            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            security import "$cert_path" \
              -k "$KEYCHAIN_PATH" \
              -P "$MACOS_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign \
              -T /usr/bin/pkgbuild \
              -T /usr/bin/productbuild

            if [ -n "$MACOS_INSTALLER_CERTIFICATE_P12_BASE64" ]; then
              installer_cert_path="$RUNNER_TEMP/installer_certificate.p12"
              printf '%s' "$MACOS_INSTALLER_CERTIFICATE_P12_BASE64" | base64 --decode > "$installer_cert_path"
              security import "$installer_cert_path" \
                -k "$KEYCHAIN_PATH" \
                -P "$MACOS_CERTIFICATE_PASSWORD" \
                -T /usr/bin/codesign \
                -T /usr/bin/pkgbuild \
                -T /usr/bin/productbuild
            fi

            security set-key-partition-list -S apple-tool:,apple:,codesign:,pkgbuild:,productbuild: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')
            security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
            security default-keychain -s "$KEYCHAIN_PATH"

            echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
            echo "Installed and unlocked certificate(s) into build keychain. Code signing & installer identities:"
            security find-identity -v "$KEYCHAIN_PATH"
          fi

      - name: Restore notarization API key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID || 'D75ZL2XFR6' }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER || '69a6de8d-ba3f-47e3-e053-5b8c7c11a4d1' }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$APPLE_API_KEY_P8_BASE64" ] && [ -n "$APPLE_API_KEY_ID" ]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key_path"
            chmod 600 "$key_path"
            echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
            echo "Restored notarization API key to $key_path"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate build configuration
        run: |
          npm run lint
          npm run test:notifications

      - name: Build, sign, notarize, and verify
        run: npm run dist:mac:release

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vitelglobal-desktop-macos-universal
          if-no-files-found: error
          path: |
            dist/macos/*.dmg
            dist/macos/*.pkg
            dist/macos/*.zip
            dist/macos/latest-mac.yml
            dist/macos/*.blockmap

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/macos/*.dmg
            dist/macos/*.pkg
            dist/macos/*.zip
            dist/macos/latest-mac.yml
            dist/macos/*.blockmap
          generate_release_notes: true
          draft: false
          prerelease: false
