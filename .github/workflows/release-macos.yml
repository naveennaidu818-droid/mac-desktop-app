name: Build macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Sign, notarize, and verify universal macOS release
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore code signing certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$MACOS_CERTIFICATE_P12_BASE64" ]; then
            cert_path="$RUNNER_TEMP/certificate.p12"
            printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert_path"
            echo "CSC_LINK=$cert_path" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MACOS_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            echo "Restored certificate to $cert_path"
          fi

      - name: Restore notarization API key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$APPLE_API_KEY_P8_BASE64" ] && [ -n "$APPLE_API_KEY_ID" ]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key_path"
            chmod 600 "$key_path"
            echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
            echo "Restored notarization API key to $key_path"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate build configuration
        run: |
          npm run lint
          npm run test:notifications

      - name: Build, sign, notarize, and verify
        run: npm run dist:mac:release

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vitelglobal-desktop-macos-universal
          if-no-files-found: error
          path: |
            dist/macos/*.dmg
            dist/macos/*.pkg
            dist/macos/*.zip
            dist/macos/latest-mac.yml
            dist/macos/*.blockmap

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/macos/*.dmg
            dist/macos/*.pkg
            dist/macos/*.zip
            dist/macos/latest-mac.yml
            dist/macos/*.blockmap
          generate_release_notes: true
          draft: false
          prerelease: false
