name: Build Mac App Store (MAS) release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-mas:
    name: Build and sign Universal Mac App Store (MAS) package
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up macOS MAS signing keychain
        env:
          MAS_CERTIFICATE_P12_BASE64: ${{ secrets.MAS_CERTIFICATE_P12_BASE64 }}
          MAS_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.MAS_INSTALLER_CERTIFICATE_P12_BASE64 }}
          MAS_CERTIFICATE_PASSWORD: ${{ secrets.MAS_CERTIFICATE_PASSWORD || 'Vitel@123' }}
          MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$MAS_PROVISIONING_PROFILE_BASE64" ]; then
            mkdir -p build
            printf '%s' "$MAS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "build/embedded.provisionprofile"
            echo "Restored provisioning profile to build/embedded.provisionprofile"
          fi

          if [ -n "$MAS_CERTIFICATE_P12_BASE64" ]; then
            cert_path="$RUNNER_TEMP/mas_certificate.p12"
            printf '%s' "$MAS_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert_path"

            KEYCHAIN_PATH="$RUNNER_TEMP/build_mas.keychain"
            KEYCHAIN_PASSWORD="build_mas_keychain_password_$(date +%s)"

            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            security import "$cert_path" \
              -k "$KEYCHAIN_PATH" \
              -P "$MAS_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign \
              -T /usr/bin/pkgbuild \
              -T /usr/bin/productbuild

            if [ -n "$MAS_INSTALLER_CERTIFICATE_P12_BASE64" ]; then
              installer_cert_path="$RUNNER_TEMP/mas_installer_certificate.p12"
              printf '%s' "$MAS_INSTALLER_CERTIFICATE_P12_BASE64" | base64 --decode > "$installer_cert_path"
              security import "$installer_cert_path" \
                -k "$KEYCHAIN_PATH" \
                -P "$MAS_CERTIFICATE_PASSWORD" \
                -T /usr/bin/codesign \
                -T /usr/bin/pkgbuild \
                -T /usr/bin/productbuild
            fi

            security set-key-partition-list -S apple-tool:,apple:,codesign:,pkgbuild:,productbuild: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')
            security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
            security default-keychain -s "$KEYCHAIN_PATH"

            echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
            echo "Installed and unlocked certificates into MAS keychain. Identities:"
            security find-identity -v "$KEYCHAIN_PATH"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate build configuration
        run: |
          npm run lint
          npm run test:notifications

      - name: Build Universal Mac App Store package
        run: npm run dist:mas

      - name: List MAS output artifacts
        run: |
          ls -la dist/mas/

      - name: Upload Universal MAS PKG installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitelglobal-desktop-mas-universal-pkg
          if-no-files-found: error
          path: dist/mas/*.pkg

      - name: Publish MAS PKG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mas/*.pkg
          generate_release_notes: true
          draft: false
          prerelease: false
