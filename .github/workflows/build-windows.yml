name: Build Windows installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build Windows x64 installers
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate desktop behavior
        run: |
          npm run lint
          npm run test:notifications

      - name: Build Windows Setup and Portable installers
        run: npm run dist:win

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: vitelglobal-desktop-windows-x64
          if-no-files-found: error
          path: |
            dist/windows/*-setup.exe
            dist/windows/*-portable.exe
            dist/windows/*.blockmap
