name: Build Mac App Store (MAS) Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*mas*"
  workflow_dispatch:
    inputs:
      upload_to_app_store:
        description: "Upload built PKG directly to App Store Connect"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-mas:
    name: Build Mac App Store PKG Installers
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up macOS Apple Distribution signing keychain
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$MACOS_CERTIFICATE_P12_BASE64" ]; then
            cert_path="$RUNNER_TEMP/certificate.p12"
            printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert_path"

            KEYCHAIN_PATH="$RUNNER_TEMP/mas_build.keychain"
            KEYCHAIN_PASSWORD="mas_keychain_password_$(date +%s)"

            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            security import "$cert_path" \
              -k "$KEYCHAIN_PATH" \
              -P "$MACOS_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign \
              -T /usr/bin/productbuild \
              -T /usr/bin/pkgbuild

            security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')
            security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
            security default-keychain -s "$KEYCHAIN_PATH"

            echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
            echo "Installed and unlocked Apple Distribution certificate for Mac App Store build."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "No signing certificate secret found; skipping signing keychain setup."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate configuration and test notifications
        run: |
          npm run lint
          npm run test:notifications

      - name: Build Mac App Store (MAS) Packages
        run: npm run dist:mas

      - name: Upload Universal Mac App Store PKG Installer
        uses: actions/upload-artifact@v4
        with:
          name: vitelglobal-desktop-mas-universal-pkg
          if-no-files-found: warn
          path: dist/mas/*universal*.pkg

      - name: Upload Apple Silicon Mac App Store PKG Installer
        uses: actions/upload-artifact@v4
        with:
          name: vitelglobal-desktop-mas-arm64-pkg
          if-no-files-found: warn
          path: dist/mas/*arm64*.pkg

      - name: Upload Intel Mac App Store PKG Installer
        uses: actions/upload-artifact@v4
        with:
          name: vitelglobal-desktop-mas-x64-pkg
          if-no-files-found: warn
          path: dist/mas/*x64*.pkg

      - name: Upload to App Store Connect (If .p8 key is available)
        if: ${{ github.event.inputs.upload_to_app_store == 'true' && env.APP_STORE_CONNECT_API_KEY != '' }}
        env:
          API_KEY_ID: "55B2T7C3UQ"
          API_ISSUER: "69a6de8d-ba3f-47e3-e053-5b8c7c11a4d1"
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        shell: bash
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

          for pkg in dist/mas/*.pkg; do
            if [ -f "$pkg" ]; then
              echo "Uploading $pkg to App Store Connect..."
              xcrun altool --upload-app -f "$pkg" -t osx \
                --apiKey "$API_KEY_ID" \
                --apiIssuer "$API_ISSUER"
            fi
          done
